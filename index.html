<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STAR DEFENDER — 縦スクロールシューティング</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d1c;color:#e8efff}body{display:flex;justify-content:center;align-items:center;padding:14px;overscroll-behavior:none}.wrap{width:min(100%,640px);display:grid;gap:10px;justify-items:center}.head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{font-size:1rem;letter-spacing:.18em;margin:0}.head small{font-size:.75rem;color:#a9b7d2}.shell{width:min(100%,480px);position:relative;border:1px solid #314463;border-radius:14px;overflow:hidden;box-shadow:0 18px 70px #0008;background:#060c1a;touch-action:none}canvas{width:100%;height:auto;aspect-ratio:3 / 4;display:block;touch-action:none}.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;gap:5px;pointer-events:none;font-size:14px;font-weight:750;text-shadow:0 2px 8px #000}.hud span{color:#6ff7e4}.overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#060e20d9;backdrop-filter:blur(4px);padding:22px;text-align:center}.overlay.hidden{display:none}.panel{max-width:360px}.panel h2{font-size:clamp(1.5rem,5vw,2.25rem);margin:0 0 12px;letter-spacing:.12em}.panel p{line-height:1.65;color:#b8c8e4}.panel strong{color:#65f9eb}.btn{background:#56e2d2;border:0;border-radius:11px;color:#001d2a;padding:12px 24px;font:700 16px inherit;cursor:pointer;font-weight:800;min-height:44px}.btn:hover{background:#9dfff1}.footer{font-size:.82rem;line-height:1.6;color:#aebbd5;text-align:center}.footer kbd{border:1px solid #56617f;border-radius:4px;padding:2px 5px;color:#ecf2ff}.mobile-controls{display:none;width:min(100%,480px);justify-content:space-between;gap:12px;align-items:center}.control{background:#233555;border:1px solid #4a658b;border-radius:14px;color:white;padding:12px 14px;min-height:52px;font-weight:700}.control:active{background:#3a5a7c}.hint{max-width:480px;width:100%;text-align:center;color:#90a3c3;font-size:12px}@media (pointer:coarse){.mobile-controls{display:flex}.footer{font-size:.75rem}}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><h1>✦ STAR DEFENDER</h1><small>HTML5 DEMO / v1.0</small></div>
 <div class="shell" id="shell">
  <canvas id="game" width="480" height="640" aria-label="縦スクロールシューティングのゲーム画面"></canvas>
  <div class="hud"><div>SCORE <span id="score">000000</span></div><div>HP <span id="hp">♥♥♥</span></div><div>LEVEL <span id="level">1</span></div></div>
  <div class="overlay" id="overlay"><div class="panel"><h2 id="overlayTitle">STAR DEFENDER</h2><p id="overlayText">迫りくる敵機を迎撃せよ！<br>敵を倒してスコアを稼ぎ、できるだけ長く生き残ろう。<br><br><strong>矢印キー / WASD</strong> で移動<br><strong>SPACE</strong> で射撃（押しっぱなしOK）<br>スマホでは画面をドラッグして移動・自動射撃</p><button class="btn" id="start">ゲーム開始</button></div></div>
 </div>
 <div class="mobile-controls"><button class="control" id="pause">一時停止</button><span style="color:#adbfdb;font-size:12px">画面内を指で動かして射撃</span><button class="control" id="restart">再スタート</button></div>
 <div class="footer">PC: <kbd>←↑↓→</kbd> / <kbd>WASD</kbd> 移動 ・ <kbd>SPACE</kbd> 射撃 ・ <kbd>P</kbd> 一時停止<br>画面タッチ / ドラッグ操作にも対応</div>
</div>
<script>
(()=>{
'use strict';
const W=480,H=640,canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={score:document.getElementById('score'),hp:document.getElementById('hp'),level:document.getElementById('level'),overlay:document.getElementById('overlay'),title:document.getElementById('overlayTitle'),text:document.getElementById('overlayText'),start:document.getElementById('start')};
const keys=new Set();let state='title',player,shots=[],enemies=[],enemyShots=[],particles=[],stars=[],score=0,elapsed=0,spawnTimer=0,shotTimer=0,flash=0,lastTime=0,pointerActive=false,pointerX=W/2,pointerY=H-90;
let audioCtx=null;
function tone(freq,duration=0.06,type='square',gain=0.025){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch{}}
function rng(a,b){return a+Math.random()*(b-a)}
function reset(){player={x:W/2,y:H-75,r:16,hp:3,invuln:0};shots=[];enemies=[];enemyShots=[];particles=[];score=0;elapsed=0;spawnTimer=.6;shotTimer=0;flash=0;pointerActive=false;keys.clear();ui.overlay.classList.add('hidden');state='playing';updateHUD();lastTime=performance.now()}
function updateHUD(){ui.score.textContent=String(score).padStart(6,'0');ui.hp.textContent='♥'.repeat(player.hp)+'♡'.repeat(3-player.hp);ui.level.textContent=String(1+Math.floor(elapsed/25))}
function showOverlay(title,message,button){ui.title.textContent=title;ui.text.innerHTML=message;ui.start.textContent=button;ui.overlay.classList.remove('hidden')}
function pauseToggle(){if(state==='playing'){state='paused';showOverlay('PAUSED','一時停止中です。<br>準備ができたら再開してください。','再開')}else if(state==='paused'){state='playing';ui.overlay.classList.add('hidden');lastTime=performance.now()}}
function startClick(){if(state==='paused')pauseToggle();else reset()}
ui.start.addEventListener('click',startClick);
document.getElementById('pause').addEventListener('click',pauseToggle);document.getElementById('restart').addEventListener('click',reset);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','p','enter'].includes(k))e.preventDefault();if(k==='p'&&!e.repeat)pauseToggle();else if(k==='enter'&&state!=='playing')startClick();keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();pointerActive=false;if(state==='playing')pauseToggle()});
function pointerPos(e){const r=canvas.getBoundingClientRect();pointerX=(e.clientX-r.left)*W/r.width;pointerY=(e.clientY-r.top)*H/r.height}
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();pointerActive=true;pointerPos(e);try{canvas.setPointerCapture(e.pointerId)}catch{}});
canvas.addEventListener('pointermove',e=>{if(pointerActive){e.preventDefault();pointerPos(e)}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>pointerActive=false);
stars=Array.from({length:95},()=>({x:rng(0,W),y:rng(0,H),speed:rng(18,115),r:rng(.5,2),alpha:rng(.2,.85)}));
function boom(x,y,color,count=15){for(let i=0;i<count;i++){let a=rng(0,Math.PI*2),s=rng(25,145);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rng(.2,.6),max:.6,r:rng(1.5,4),color})}}
function addEnemy(){const level=1+Math.floor(elapsed/25);const elite=Math.random()<Math.min(.12+level*.045,.38);enemies.push({x:rng(30,W-30),y:-30,r:elite?23:17,hp:elite?3:1,speed:rng(60,100)+level*13,phase:rng(0,6.28),age:0,elite,shoot:rng(1.1,2.7)})}
function collides(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<(a.r+b.r)*(a.r+b.r)}
function hurt(){if(player.invuln>0)return;player.hp--;player.invuln=1.5;flash=.2;boom(player.x,player.y,'#7eefff',18);tone(110,.2,'sawtooth',.055);updateHUD();if(player.hp<=0){state='over';showOverlay('GAME OVER',`最終スコア：<strong>${score.toLocaleString()}</strong><br>生存時間：${Math.floor(elapsed)} 秒<br><br>もう一度挑戦しましょう。`,'もう一度プレイ')}}
function update(dt){if(state!=='playing')return;elapsed+=dt;spawnTimer-=dt;shotTimer-=dt;flash=Math.max(0,flash-dt);player.invuln=Math.max(0,player.invuln-dt);
let vx=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);let vy=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);
if(pointerActive){const f=Math.min(1,dt*14);player.x+=(pointerX-player.x)*f;player.y+=(pointerY-38-player.y)*f}else{const n=Math.hypot(vx,vy)||1;player.x+=vx/n*290*dt;player.y+=vy/n*290*dt}player.x=Math.max(20,Math.min(W-20,player.x));player.y=Math.max(45,Math.min(H-23,player.y));
if((keys.has(' ')||pointerActive)&&shotTimer<=0){shots.push({x:player.x-8,y:player.y-16,r:4,vy:-480},{x:player.x+8,y:player.y-16,r:4,vy:-480});shotTimer=.15;tone(650,.025,'square',.012)}
if(spawnTimer<=0){addEnemy();spawnTimer=Math.max(.29,.92-elapsed*.006)*rng(.8,1.25)}
for(const s of shots)s.y+=s.vy*dt;shots=shots.filter(s=>s.y>-20);
for(const e of enemies){e.age+=dt;e.y+=e.speed*dt;e.x+=Math.sin(e.age*2+e.phase)*25*dt;e.shoot-=dt;if(e.elite&&e.y>30&&e.y<H*.6&&e.shoot<=0){const dx=player.x-e.x,dy=player.y-e.y,l=Math.hypot(dx,dy)||1;enemyShots.push({x:e.x,y:e.y,r:6,vx:dx/l*125,vy:dy/l*125});e.shoot=2.8}}
for(const s of enemyShots){s.x+=s.vx*dt;s.y+=s.vy*dt}enemyShots=enemyShots.filter(s=>s.y<H+20&&s.x>-20&&s.x<W+20);
for(let i=shots.length-1;i>=0;i--){let hit=false;for(let j=enemies.length-1;j>=0;j--){if(collides(shots[i],enemies[j])){hit=true;const e=enemies[j];e.hp--;boom(shots[i].x,shots[i].y,'#a8efff',3);if(e.hp<=0){score+=e.elite?250:100;boom(e.x,e.y,e.elite?'#ffc46b':'#ff6486',18);tone(e.elite?190:260,.09,'triangle',.025);enemies.splice(j,1);updateHUD()}break}}if(hit)shots.splice(i,1)}
for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(collides(e,player)){enemies.splice(j,1);boom(e.x,e.y,'#ff6688');hurt()}else if(e.y>H+30){enemies.splice(j,1)}}
for(let i=enemyShots.length-1;i>=0;i--)if(collides(enemyShots[i],player)){enemyShots.splice(i,1);hurt()}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
}
function drawShip(x,y,color='#69f2ee'){ctx.save();ctx.translate(x,y);ctx.shadowColor=color;ctx.shadowBlur=16;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(17,15);ctx.lineTo(8,11);ctx.lineTo(0,17);ctx.lineTo(-8,11);ctx.lineTo(-17,15);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#174976';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(6,5);ctx.lineTo(-6,5);ctx.closePath();ctx.fill();ctx.fillStyle='#ffab53';ctx.fillRect(-9,14,5,rng(7,16));ctx.fillRect(4,14,5,rng(7,16));ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.shadowColor=e.elite?'#ffc467':'#ff5b8e';ctx.shadowBlur=13;ctx.fillStyle=e.elite?'#edac52':'#e64b81';ctx.beginPath();ctx.moveTo(0,e.r);ctx.lineTo(e.r,-e.r*.7);ctx.lineTo(e.r*.5,-e.r*.5);ctx.lineTo(0,-e.r*.2);ctx.lineTo(-e.r*.5,-e.r*.5);ctx.lineTo(-e.r,-e.r*.7);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#19233c';ctx.fillRect(-5,-7,10,9);ctx.restore()}
function draw(dt){ctx.fillStyle='#071024';ctx.fillRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#101e3c');bg.addColorStop(1,'#050c1c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(const s of stars){s.y=(s.y+s.speed*dt)%H;ctx.globalAlpha=s.alpha;ctx.fillStyle='#c4f5ff';ctx.fillRect(s.x,s.y,s.r,s.r*2.5)}ctx.globalAlpha=1;
ctx.strokeStyle='#1a3654';ctx.lineWidth=1;const scroll=(elapsed*20)%80;for(let y=scroll-80;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(const s of shots){ctx.fillStyle='#89fff6';ctx.shadowColor='#50faff';ctx.shadowBlur=14;ctx.fillRect(s.x-3,s.y-10,6,18)}ctx.shadowBlur=0;
for(const e of enemies)drawEnemy(e);for(const s of enemyShots){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='#ffae5c';ctx.shadowColor='#ffae5c';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2.5);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;
if(player&&(state==='playing'||state==='paused'||state==='over')){if(player.invuln<=0||Math.floor(player.invuln*10)%2===0)drawShip(player.x,player.y);if(player.invuln>0){ctx.strokeStyle='#65e8ff77';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,27,0,Math.PI*2);ctx.stroke()}}
if(flash>0){ctx.fillStyle=`rgba(255,72,108,${flash*.65})`;ctx.fillRect(0,0,W,H)}
}
function frame(t){const dt=Math.min(.04,(t-(lastTime||t))/1000);lastTime=t;if(state==='playing')update(dt);draw(state==='playing'?dt:0);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
